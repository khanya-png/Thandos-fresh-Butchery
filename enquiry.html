  <div class="logo">
    <img src="images/logo.png" alt="Thando's Fresh Butchery Logo" style="height:50px;">
    Thando's Fresh Butchery

  <button class="hamburger" id="hamburger">☰</button>

    <section>
        <h2>Place Your Enquiry / Order</h2>
        <p>Fill in the form below and we will get back to you within 24 hours.</p>

        <form>
            <label>Full Name:</label><br>
            <input type="text" placeholder="Enter your name" required><br><br>

            <label>Phone Number:</label><br>
            <input type="tel" placeholder="e.g. 071 123 4567" required><br><br>

            <label>Email:</label><br>
            <input type="email" placeholder="Enter your email"><br><br>

            <label>What would you like to order?</label><br>
            <select>
                <option>Beef</option>
                <option>Chicken</option>
                <option>Pork</option>
                <option>Braai Pack - Small (R180)</option>
                <option>Braai Pack - Family (R399)</option>
                <option>Braai Pack - Party (R750)</option>
            </select><br><br>

            <label>Quantity (kg):</label><br>
            <input type="number" placeholder="e.g. 2"><br><br>

            <label>Your Message:</label><br>
            <textarea rows="5" placeholder="Write your enquiry here..."></textarea><br><br>

            <button type="submit">Send Enquiry</button>
        </form>
    </section>
